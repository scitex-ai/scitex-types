[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-types"
version = "0.1.6"
description = "Scientific type definitions (ArrayLike, ColorLike) and validation"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Tier 1 (hard) — required for the package's only public surface
    # (Python API + skills entry-point) to work out of `pip install
    # scitex-types`. `scitex_dev.try_import_optional` is used by
    # `_ArrayLike` to gate the optional numpy/pandas/xarray/torch
    # members of the ArrayLike union; the helper lives in scitex-dev's
    # light core (no heavy transitive imports).
    "scitex-dev>=0.11.5",
]

[project.optional-dependencies]
# Tier 2 — `pip install scitex-types[all]` enables every
# graceful-degradation feature. Each library widens the `ArrayLike`
# union and unlocks the matching `is_array_like()` runtime check.
all = [
    "numpy",
    "pandas",
    "torch",
    "xarray",
]

# Tier 3 — maintainer-only tools (tests + docs build). Does not
# duplicate `scitex-dev` (already hard) and does not include the
# `[all]` array libraries (install with `.[all,dev]` for the full
# matrix). nbconvert/openpyxl are intentionally absent — scitex-types
# has no notebook tests or xlsx fixtures.
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-types"
Repository = "https://github.com/ywatanabe1989/scitex-types"
Issues = "https://github.com/ywatanabe1989/scitex-types/issues"
Documentation = "https://scitex-types.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-types = "scitex_types"

[project.entry-points."scitex_dev.skills"]
scitex-types = "scitex_types"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_types"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (runs on every PR)",
]

[tool.coverage.run]
parallel = true
source = ["scitex_types"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
